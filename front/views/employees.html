<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management</title>
    <link rel="stylesheet" href="../css/style.css">
    <!-- Font Awesome CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <!-- bootstrap.css -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container-fluid">
        <!-- Nav Bar -->
        <div class="header-bar d-flex align-items-center justify-content-between">
            <div>
                <!-- logo here -->
                <h3>LOGO</h3>
            </div>
            <nav class="main-nav">
                <a href="index.html" class="nav-link">Home</a>
                <a href="#" class="nav-link">Shifts</a>
                <a href="employees.html" class="nav-link">Employees</a>
            </nav>
        </div>

        <!-- Employee Management Card -->
        <div class="card mt-4">
            <div class="card-body">
                <h1 class="text-center">Employee Management</h1>
                
                <form id="employeeForm" class="mb-4">
                    <div class="form-row">
                        <div class="col-md-3">
                            <label for="employeeId">ID:</label>
                            <input type="number" id="employeeId" class="form-control">
                        </div>
                        <div class="col-md-3">
                            <label for="firstName">First Name:</label>
                            <input type="text" id="firstName" class="form-control" required>
                        </div>
                        <div class="col-md-3">
                            <label for="lastName">Last Name:</label>
                            <input type="text" id="lastName" class="form-control" required>
                        </div>
                        <div class="col-md-3">
                            <label for="department">Department:</label>
                            <input type="text" id="department" class="form-control" required>
                        </div>
                    </div>
                    <div class="mt-3">
                        <button type="submit" id="submitBtn" class="btn btn-primary">Add Employee</button>
                    </div>
                </form>
                
                <h2>Employees</h2>
                <div class="table-responsive">
                    <table id="employeesTable" class="table table-striped">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>First Name</th>
                                <th>Last Name</th>
                                <th>Department</th>
                            </tr>
                        </thead>
                        <tbody>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('employeeForm');
        const tableBody = document.querySelector('#employeesTable tbody');
        const submitBtn = document.getElementById('submitBtn');
        const employeeId = document.getElementById('employeeId');
        const firstName = document.getElementById('firstName');
        const lastName = document.getElementById('lastName');
        const department = document.getElementById('department');

        // Load employees on page load
        loadEmployees();

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const data = {
                id: employeeId.value ? parseInt(employeeId.value) : null,
                firstName: firstName.value,
                lastName: lastName.value,
                department: department.value
            };

            // Add
            fetch('/api/employees', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                if (result.success) {
                    alert('Employee added!');
                    resetForm();
                    loadEmployees();
                } else {
                    alert('Error: ' + result.error);
                }
            });
        });

        function loadEmployees() {
            fetch('/api/employees')
            .then(response => response.json())
            .then(employees => {
                tableBody.innerHTML = '';
                employees.forEach(emp => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${emp._id}</td>
                        <td>${emp._firstName}</td>
                        <td>${emp._lastName}</td>
                        <td>${emp._department}</td>
                    `;
                    tableBody.appendChild(row);
                });
            });
        }

        function resetForm() {
            employeeId.value = '';
            firstName.value = '';
            lastName.value = '';
            department.value = '';
        }
    </script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
