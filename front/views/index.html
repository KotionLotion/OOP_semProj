<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Shift Dashboard</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container-fluid">
        <div class="header-bar d-flex align-items-center justify-content-between">
            <div><h3>LOGO</h3></div>
            <nav class="main-nav">
                <a href="/views/index.html" class="nav-link">Home</a>
                <a href="#" class="nav-link">Shifts</a>
                <a href="/views/employees.html" class="nav-link">Employees</a>
                <a href="#" class="nav-link" id="logoutBtn">Logout</a>
                <span class="nav-link text-muted" id="currentUser" style="background-color: aquamarine;"></span>
            </nav>
        </div>

        <div class="card mt-4">
            <div class="card-body text-center">
                <h1 class="m-0">Welcome!</h1>
                <p class="text-muted p-1">OOP Semester Project | Shu Mai, Jesse Melgar, Alex Milian</p>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-md-12 col-lg-4 mb-3">
                <a href="/views/employees.html" class="text-decoration-none">
                    <div class="card h-100 d-flex align-items-center position-relative">
                        <i class="fas fa-users fa-6x position-absolute text-muted" style="opacity:0.1; right:10px; bottom:10px;"></i>
                        <div class="card-body text-left">
                            <h5>Employees</h5>
                            <p>Total: 25</p>
                        </div>
                    </div>
                </a>
            </div>
            <div class="col-md-12 col-lg-4 mb-3">
                <a href="#" class="text-decoration-none">
                    <div class="card h-100 d-flex align-items-center position-relative">
                        <i class="fas fa-clock fa-6x position-absolute text-muted" style="opacity:0.1; right:10px; bottom:10px;"></i>
                        <div class="card-body text-left">
                            <h5>Shifts Today</h5>
                            <p>Morning: 10 | Evening: 8</p>
                        </div>
                    </div>
                </a>
            </div>
            <div class="col-md-12 col-lg-4 mb-3">
                <a href="#" class="text-decoration-none">
                    <div class="card h-100 d-flex align-items-center position-relative">
                        <i class="fas fa-tasks fa-6x position-absolute text-muted" style="opacity:0.1; right:10px; bottom:10px;"></i>
                        <div class="card-body text-left">
                            <h5>IDK? Employees off?</h5>
                            <p>?</p>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/views/login.html';
        } else {
            fetch('/api/auth/me', {
                headers: { 'Authorization': 'Bearer ' + token }
            })
            .then(r => r.json())
            .then(data => {
                if (!data.success) {
                    localStorage.removeItem('token');
                    window.location.href = '/views/login.html';
                    return;
                }
                document.getElementById('currentUser').textContent = data.user.username;
            });
        }

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('token');
            window.location.href = '/views/login.html';
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
