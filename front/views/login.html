<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – Shift Scheduler</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="card login-card shadow">
            <div class="card-body p-4">
                <h2 class="text-center mb-4">Shift Scheduler</h2>
                <p class="text-center text-muted mb-4">Sign in to your account</p>

                <div id="errorAlert" class="alert alert-danger d-none"></div>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="form-control" placeholder="Enter username" autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter password">
                </div>
                <button id="loginBtn" class="btn btn-primary btn-block mt-3">Sign In</button>
            </div>
        </div>
    </div>

    <script>
        // Check if already logged in
        const token = localStorage.getItem('token');
        if (token) window.location.href = '/views/index.html';

        document.getElementById('loginBtn').addEventListener('click', login);
        document.getElementById('password').addEventListener('keydown', e => {
            if (e.key === 'Enter') login();
        });

        function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                showError('Please enter your username and password.');
                return;
            }

            fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            })
            .then(r => r.json())
            .then(data => {
                console.log('Login response:', data);
                if (data.success) {
                    localStorage.setItem('token', data.token);
                    window.location.href = '/views/index.html';
                } else {
                    showError(data.message || 'Login failed.');
                }
            })
            .catch(err => {
                console.error('Error:', err);
                showError('Server error. Please try again.');
            });
        }

        function showError(msg) {
            const el = document.getElementById('errorAlert');
            el.textContent = msg;
            el.classList.remove('d-none');
        }
    </script>
</body>
</html>
